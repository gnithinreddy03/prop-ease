services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rentaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentaldb"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rentaldb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 characters}
      APP_OVERRIDE_FILE: /app/application-override.yaml
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports: ["8080:8080"]
    volumes:
      - uploads:/app/uploads
      - ./application-override.yaml:/app/application-override.yaml:ro
volumes:
  postgres_data:
  uploads:
